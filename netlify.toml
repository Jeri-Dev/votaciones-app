# Frontend en Netlify; backend y datos en Google Apps Script + Google Sheets.
# Requiere la variable de entorno VITE_GAS_URL (Site configuration → Environment variables).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# La app no debe aparecer en buscadores ni incrustarse en otros sitios.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
