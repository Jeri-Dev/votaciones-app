# Frontend en Netlify; backend y datos en Google Apps Script + Google Sheets.
# Requiere la variable de entorno VITE_GAS_URL (Site configuration → Environment variables).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Rutas públicas con nombre propio: sirven la misma app (index.html).
[[redirects]]
  from = "/public-candidatos"
  to = "/index.html"
  status = 200

# La app no debe aparecer en buscadores ni incrustarse en otros sitios.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

# PWA: el service worker y el manifiesto siempre se revalidan, para que las actualizaciones lleguen.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
